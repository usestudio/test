name: build-mac-both

# 临时 workflow：私有仓库 Actions 额度耗尽时，借这个公开仓库跑 macOS runner，
# 用 SRC_TOKEN 从私有仓库检出源码。任务完成后请删除本文件与 Secret。
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: 检出私有仓库源码
        uses: actions/checkout@v4
        with:
          repository: usestudio/cocorobo-teacher-client
          ref: main
          token: ${{ secrets.SRC_TOKEN }}
          fetch-depth: 1

      - name: 装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 装主工程依赖
        run: npm ci
        env:
          npm_config_registry: https://registry.npmmirror.com

      - name: 准备 dsh 运行时
        run: node scripts/prepare-mac-runtime.js
        env:
          NODE_VERSION: latest-v24.x

      - name: 打包 ${{ matrix.arch }}
        run: bash scripts/ci-build-mac.sh ${{ matrix.arch }}

      - name: 上传产物
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CocoBuddy-mac-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 2
