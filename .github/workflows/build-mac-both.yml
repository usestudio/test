name: build-mac-both

# 临时 workflow：借公开仓库的免费 macOS runner 打私有仓库源码。
# 私仓 Actions 账号分钟耗尽（mac/ubuntu 都 0 step 秒败），公开仓库不受影响。
# 源码通过 SRC_TOKEN Secret 检出；构建完即删除本 workflow 与 Secret。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: 检出私有源码
        uses: actions/checkout@v4
        with:
          repository: usestudio/cocorobo-teacher-client
          ref: main
          token: ${{ secrets.SRC_TOKEN }}
          fetch-depth: 1

      - name: 装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 装主工程依赖
        run: npm ci
        env:
          npm_config_registry: https://registry.npmmirror.com

      - name: 检查运行时清单没被白标化
        run: |
          node -e "
          const p = require('./resources/dsh-runtime/package.json');
          const bad = Object.keys(p.dependencies || {}).filter((k) => k.startsWith('@cocobuddy'));
          if (bad.length) { console.error('白标化：' + bad.join(', ')); process.exit(1); }
          "

      - name: 准备两个架构的 dsh 运行时
        run: node scripts/prepare-mac-runtime.js
        env:
          NODE_VERSION: latest-v24.x

      - name: 构建 ${{ matrix.arch }} 包
        run: bash scripts/ci-build-mac.sh ${{ matrix.arch }}

      - name: 上传 ${{ matrix.arch }} dmg
        uses: actions/upload-artifact@v4
        with:
          name: CocoBuddy-mac-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 7
          if-no-files-found: error
